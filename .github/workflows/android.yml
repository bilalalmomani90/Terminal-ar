name: Android Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # رقم versionCode يزداد مع كل بناء (run_number يزيد دائماً داخل هذا الـ workflow)
  VERSION_CODE: ${{ github.run_number }}
  TAR_BUILD: ${{ github.run_number }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - name: Android SDK and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Read version
        run: |
          V=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "### Terminal AR $V — Android Build ${{ github.run_number }} (versionCode ${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # مشروع Android يُولَّد وقت البناء (src-tauri/gen/android) ولا يُحفظ في المستودع.
      - name: Generate Android project
        run: npm run tauri -- android init

      # إضافات أصلية: قفل البث المتعدد (اكتشاف الأجهزة) + إعلانات Start.io (معرّف التطبيق ليس سرّاً،
      # ويمكن تغييره بمتغير المستودع START_IO_APP_ID). إن فشل الدمج أو فشل البناء بها يُبنى التطبيق بدونها تلقائياً.
      - name: Add native extras (multicast + ads bridge)
        env:
          START_IO_APP_ID: ${{ vars.START_IO_APP_ID || '210623682' }}
        run: python3 tools/android_native.py apply "$START_IO_APP_ID"

      - name: Detect signing secrets
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      # بلا أسرار توقيع: نسخة اختبار debug (موقّعة بمفتاح debug وليست مفتاح الإصدار النهائي)
      - name: Build APK (test build, debug key)
        if: steps.sign.outputs.has == 'false'
        run: |
          ok=0
          for i in 1 2 3; do
            echo "Build attempt $i"
            if npm run tauri -- android build --apk --debug --target aarch64 --config "{\"bundle\":{\"android\":{\"versionCode\":${VERSION_CODE}}}}"; then ok=1; break; fi
            sleep $((30 * i))
          done
          if [ $ok = 0 ] && [ "${NATIVE:-0}" = "1" ]; then
            echo "Build with native extras failed: retrying WITHOUT them"
            python3 tools/android_native.py revert
            echo "الإضافات الأصلية (الإعلانات واكتشاف الأجهزة): أُزيلت لأن بناءها فشل — تُبنى النسخة بدونها" >> "$GITHUB_STEP_SUMMARY"
            npm run tauri -- android build --apk --debug --target aarch64 --config "{\"bundle\":{\"android\":{\"versionCode\":${VERSION_CODE}}}}" && ok=1
          fi
          [ $ok = 1 ] || exit 1
          echo "SIGNING=debug" >> "$GITHUB_ENV"

      # مع الأسرار: بناء release ثم zipalign + apksigner بمفتاحك الثابت. لا يُكتب المفتاح في المستودع.
      - name: Build APK (release, stable key)
        if: steps.sign.outputs.has == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ok=0
          for i in 1 2 3; do
            echo "Build attempt $i"
            if npm run tauri -- android build --apk --target aarch64 --config "{\"bundle\":{\"android\":{\"versionCode\":${VERSION_CODE}}}}"; then ok=1; break; fi
            sleep $((30 * i))
          done
          if [ $ok = 0 ] && [ "${NATIVE:-0}" = "1" ]; then
            echo "Build with native extras failed: retrying WITHOUT them"
            python3 tools/android_native.py revert
            echo "الإضافات الأصلية (الإعلانات واكتشاف الأجهزة): أُزيلت لأن بناءها فشل — تُبنى النسخة بدونها" >> "$GITHUB_STEP_SUMMARY"
            npm run tauri -- android build --apk --target aarch64 --config "{\"bundle\":{\"android\":{\"versionCode\":${VERSION_CODE}}}}" && ok=1
          fi
          [ $ok = 1 ] || exit 1
          BT="$ANDROID_HOME/build-tools/34.0.0"
          UNSIGNED=$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -n 1)
          [ -n "$UNSIGNED" ] || { echo "unsigned release apk not found"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose "$RUNNER_TEMP/signed.apk"
          mkdir -p signed && cp "$RUNNER_TEMP/signed.apk" "signed/terminal-ar-release.apk"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "SIGNING=release" >> "$GITHUB_ENV"

      - name: Collect APK
        run: |
          mkdir -p out
          if [ "${SIGNING}" = "release" ]; then
            cp signed/terminal-ar-release.apk "out/Terminal-AR-${VERSION}-build${VERSION_CODE}-release.apk"
          else
            APK=$(find src-tauri/gen/android -name '*debug.apk' | head -n 1)
            [ -n "$APK" ] || { echo "debug apk not found"; exit 1; }
            cp "$APK" "out/Terminal-AR-${VERSION}-build${VERSION_CODE}-TEST-debug-key.apk"
          fi
          ls -la out
          echo "التوقيع: ${SIGNING}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: terminal-ar-${{ env.VERSION }}-android-build-${{ github.run_number }}
          path: out/*
          retention-days: 3
          if-no-files-found: error
